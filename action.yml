name: rtlgate
description: RTL release gate for Arabic web apps. Flags physical CSS, directional Tailwind, missing dir/lang, LTR inputs and un-isolated bidi runs in Arabic locale files.
branding:
  icon: check-circle
  color: green
inputs:
  paths:
    description: Space-separated files or folders to scan.
    default: "."
  max-issues:
    description: Fail the step when more than this many issues are found.
    default: "0"
  sarif-file:
    description: If set, write a SARIF report to this path (upload it with github/codeql-action/upload-sarif).
    default: ""
runs:
  using: composite
  steps:
    - name: Build rtlgate
      shell: bash
      run: cd "$GITHUB_ACTION_PATH" && npm ci --no-audit --no-fund
    - name: Run rtlgate
      shell: bash
      env:
        RTLGATE_PATHS: ${{ inputs.paths }}
        RTLGATE_MAX: ${{ inputs.max-issues }}
        RTLGATE_SARIF: ${{ inputs.sarif-file }}
      run: |
        set -f
        if [ -n "$RTLGATE_SARIF" ]; then
          node "$GITHUB_ACTION_PATH/dist/src/cli.js" $RTLGATE_PATHS --max-issues "$RTLGATE_MAX" --format sarif --output "$RTLGATE_SARIF"
        else
          node "$GITHUB_ACTION_PATH/dist/src/cli.js" $RTLGATE_PATHS --max-issues "$RTLGATE_MAX"
        fi
